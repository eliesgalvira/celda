# Despliegue de Celda en Vercel (ADR 0018, «Cómo quedó el despliegue»). Sube el código de `main`,
# y Vercel construye la web y monta las capas desde el cubo privado de R2.
#
# Lo lanza GitHub y no la máquina de la ingesta. Así esa máquina no guarda ninguna clave de Vercel
# ni de GitHub, y Vercel no se conecta al repositorio.
#
# Cada despliegue lleva unos 100 MB de capas, así que solo se despliega si cambia algo (#78). La
# orden `despliegue` de la ingesta nocturna mira dos señales y lo explica en el registro:
# - la web: la huella de lo que construye `pnpm run build`, con `vercel.json`, `vercel.sh` y el
#   código de la API (ADR 0032), no es la que sirve producción en `/despliegue.json`;
# - los datos: producción no sirve lo que un build nuevo montaría desde R2. Lee R2 con la clave de
#   solo lectura del build de Vercel, en los secretos `CELDA_R2_*`. Sin ellos, despliega siempre.
# Una señal que no se puede saber cuenta como un cambio.
#
# La huella solo depende del commit, así que se calcula una vez por commit y se guarda en la caché
# de GitHub con el commit en la clave. Solo la primera ejecución que mira un commit construye la
# web; las demás, como la de cada día cuando nadie ha empujado, leen la huella de la caché. Lo
# desplegado no se guarda, y se lee siempre de producción, así que si un despliegue falla, la
# ejecución siguiente ve que producción va atrás y vuelve a desplegar.
#
# Se mira en tres casos:
# - cada día a las 08:00 UTC, así que una versión nueva de R2 se despliega como mucho un día
#   después de publicarse;
# - en cuanto la integración continua («Celda») sale en verde tras un push a `main`, con el
#   commit exacto que ha pasado;
# - a mano, con «Run workflow», que despliega siempre.
name: Celda despliegue

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_run:
    workflows: ["Celda"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celda-despliegue
  cancel-in-progress: false

jobs:
  decidir:
    # Tras la integración continua, solo si ha salido en verde y viene de un push, no de una PR.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      desplegar: ${{ steps.decision.outputs.desplegar }}
      despliegue: ${{ steps.decision.outputs.despliegue }}
    steps:
      # Si dos pushes seguidos acaban la integración continua en otro orden, el más viejo no
      # puede pisar al nuevo, porque tras la integración continua solo se mira la punta de la rama.
      # El trabajo de despliegue sube luego este mismo commit.
      - name: Elegir el commit de main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PROBADO: ${{ github.event.workflow_run.head_sha }}
        run: |
          punta=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          if [ -n "$PROBADO" ] && [ "$PROBADO" != "$punta" ]; then
            echo "main ya va por $punta; no se despliega $PROBADO."
          else
            echo "Se mira $punta, la punta de main."
            echo "commit=$punta" >> "$GITHUB_OUTPUT"
          fi

      # Se copia el repositorio entero, como en la integración continua, porque Nix lee el flake de
      # los objetos de git y una copia parcial (`sparse-checkout`) no trae el resto de ficheros.
      - uses: actions/checkout@v7
        if: steps.commit.outputs.commit != ''
        with:
          ref: ${{ steps.commit.outputs.commit }}
          persist-credentials: false

      # La huella de la web es función del commit. El `2` cambia si cambia la forma de calcularla.
      - name: Huella de la web ya calculada
        id: memoria
        if: steps.commit.outputs.commit != ''
        uses: actions/cache/restore@v6
        with:
          path: huella-web
          key: celda-web-huella-2-${{ steps.commit.outputs.commit }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: steps.commit.outputs.commit != ''
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      # Esto y los dos pasos siguientes solo corren en la primera ejecución que mira el commit, o
      # si la caché ha perdido su huella.
      - name: Caché del almacén de pnpm
        if: steps.commit.outputs.commit != '' && steps.memoria.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Construir la web y calcular su huella
        if: steps.commit.outputs.commit != '' && steps.memoria.outputs.cache-hit != 'true'
        run: |
          nix develop --command pnpm install --frozen-lockfile
          nix develop --command pnpm run build
          nix run .#celda-nocturna -- huella-web "$PWD/apps/web" "$GITHUB_WORKSPACE/huella-web"

      - name: Guardar la huella de la web
        if: steps.commit.outputs.commit != '' && steps.memoria.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: huella-web
          key: celda-web-huella-2-${{ steps.commit.outputs.commit }}

      # La orden corre desde el paquete de Nix de la ingesta, que no instala las dependencias de
      # la web.
      - name: Decidir si se despliega
        id: decision
        if: steps.commit.outputs.commit != ''
        env:
          CELDA_SITIO: https://celda.elies.site
          CELDA_R2_CUENTA: ${{ secrets.CELDA_R2_CUENTA }}
          CELDA_R2_CUBO: ${{ secrets.CELDA_R2_CUBO }}
          CELDA_R2_ID_CLAVE: ${{ secrets.CELDA_R2_ID_CLAVE }}
          CELDA_R2_SECRETO: ${{ secrets.CELDA_R2_SECRETO }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          A_MANO: ${{ github.event_name == 'workflow_dispatch' && 'si' || '' }}
        run: |
          huella=$(cat "$GITHUB_WORKSPACE/huella-web")
          nix run .#celda-nocturna -- despliegue --huella "$huella" --commit "$COMMIT" \
            ${A_MANO:+--a-mano} --salida "$GITHUB_OUTPUT"
          grep '^motivo=' "$GITHUB_OUTPUT" | cut -d= -f2- >> "$GITHUB_STEP_SUMMARY"

  desplegar:
    needs: decidir
    if: needs.decidir.outputs.desplegar == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decidir.outputs.commit }}
          persist-credentials: false
      # El build de Vercel escribe CELDA_DESPLIEGUE en /despliegue.json, y la siguiente ejecución
      # lo lee para saber si la web ha cambiado.
      - name: Desplegar en producción
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DESPLIEGUE: ${{ needs.decidir.outputs.despliegue }}
        run: >-
          npx --yes vercel@62.2.0 deploy --prod --yes --token "$VERCEL_TOKEN"
          --build-env "CELDA_DESPLIEGUE=$DESPLIEGUE"
