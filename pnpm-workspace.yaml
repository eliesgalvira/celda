packages:
  - apps/*
  - packages/*
  - tools/*
  - convex

# Versiones exactas: se suben en commits deliberados, leyendo antes el
# CHEATSHEET.md de solid-js y las notas de Effect (ADR 0001 y 0002).
# Confect sube en su propio commit, leyendo antes su changelog (ADR 0003).
catalog:
  "@confect/cli": 10.0.0-next.24
  "@confect/core": 10.0.0-next.24
  "@confect/server": 10.0.0-next.24
  "@confect/test": 10.0.0-next.24
  "@convex-dev/rate-limiter": 0.4.0
  "@effect/platform-node": 4.0.0-rc.117
  "@effect/sql-sqlite-node": 4.0.0-rc.117
  "@effect/tsgo": 0.46.0
  "@effect/vitest": 4.0.0-rc.117
  "@oxlint/plugins": 1.85.0
  "@solidjs/testing-library": 1.0.0-beta.3
  "@solidjs/vite-plugin": 3.0.0-next.44
  "@solidjs/web": 2.0.0-rc.9
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  convex: 1.46.0
  convex-test: 0.0.60
  effect: 4.0.0-rc.117
  fake-indexeddb: 6.2.5
  happy-dom: 20.14.5
  kdbush: 4.1.0
  maplibre-gl: 6.11.2
  oxlint: 1.85.0
  playwright-core: 1.63.0
  solid-js: 2.0.0-rc.9
  supercluster: 9.1.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  uqr: 0.1.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

# vite-plus sustituye a vite con su propio núcleo (vite 8 por dentro).
peerDependencyRules:
  allowedVersions:
    vite: "*"

overrides:
  "@types/node": 24.19.0
